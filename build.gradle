plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def locksmithRestartProbePhase = providers.gradleProperty('totemLocksmithRestartProbePhase')
        .orElse(providers.environmentVariable('TOTEM_LOCKSMITH_RESTART_PROBE_PHASE'))
        .orNull
def locksmithRestartProbeMarkerDirectory = providers.gradleProperty('totemLocksmithRestartProbeMarkerDir')
        .orElse(providers.environmentVariable('TOTEM_LOCKSMITH_RESTART_PROBE_MARKER_DIR'))
        .orNull

def totemCoreJar = file(providers.gradleProperty('totemCoreJar')
        .getOrElse('../TotemCore/build/libs/totem-core-0.6.0.jar'))

loom {
    splitEnvironmentSourceSets()
    mods {
        'totem-locksmith' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'totem-locksmith-gametest'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

loom {
    runs {
        locksmithRestartProbe {
            server()
            setConfigName('TotemLocksmith Restart Probe')
            ideConfigGenerated(false)
            runDir('run/locksmithRestartProbe')
            source sourceSets.gametest
            programArg('--nogui')
            if (locksmithRestartProbePhase != null) {
                environmentVariable('TOTEM_LOCKSMITH_RESTART_PROBE_PHASE', locksmithRestartProbePhase)
            }
            if (locksmithRestartProbeMarkerDirectory != null) {
                environmentVariable('TOTEM_LOCKSMITH_RESTART_PROBE_MARKER_DIR', locksmithRestartProbeMarkerDirectory)
            }
        }
    }
}

tasks.named('runLocksmithRestartProbe').configure {
    doFirst {
        File runDirectory = file('run/locksmithRestartProbe')
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
    }
}

tasks.named('generateDLIConfig').configure {
    inputs.property('totemLocksmithRestartProbePhase', locksmithRestartProbePhase ?: '')
    inputs.property('totemLocksmithRestartProbeMarkerDirectory', locksmithRestartProbeMarkerDirectory ?: '')
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
    maven { url = 'https://maven.nucleoid.xyz/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files(totemCoreJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.register("normalizeFabricApiTweakersForNamedDevRuntime") {
    group = "fabric"
    description = "Normalizes Fabric API classTweaker/access-widener namespaces for Minecraft 26.2 named dev runtimes."

    doLast {
        def jarFiles = new LinkedHashSet<File>()
        jarFiles.addAll(configurations.runtimeClasspath.resolve().findAll { file ->
            file.name.endsWith(".jar")
                    && file.absolutePath.contains("${File.separator}net.fabricmc.fabric-api${File.separator}")
        })

        [gradle.gradleUserHomeDir, new File(System.getProperty("user.home"), ".gradle")].each { File cacheRoot ->
            File fabricApiCache = new File(cacheRoot, "caches/modules-2/files-2.1/net.fabricmc.fabric-api")
            if (fabricApiCache.isDirectory()) {
                jarFiles.addAll(fileTree(dir: fabricApiCache, include: "**/*.jar").files.findAll { file ->
                    !file.name.endsWith("-sources.jar")
                })
            }
        }

        int patchedFiles = 0
        int patchedEntries = 0
        jarFiles.each { File jarFile ->
            File tempFile = new File(buildDir, "tmp/tweaker-normalized/${jarFile.name}.tmp")
            tempFile.parentFile.mkdirs()
            boolean fileChanged = false
            def zipFile = new java.util.zip.ZipFile(jarFile)
            def zipOut = new java.util.zip.ZipOutputStream(
                    new java.io.BufferedOutputStream(new java.io.FileOutputStream(tempFile)))
            try {
                def entries = zipFile.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    zipOut.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    byte[] bytes = entry.isDirectory() ? new byte[0] : zipFile.getInputStream(entry).bytes
                    if (!entry.directory
                            && (entry.name.endsWith(".classtweaker") || entry.name.endsWith(".accesswidener"))) {
                        String text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
                        String normalized = text
                                .replaceFirst(/(?m)^(classTweaker\s+v\d+\s+)official(\s*)$/, '$1named$2')
                                .replaceFirst(/(?m)^(accessWidener\s+v\d+\s+)official(\s*)$/, '$1named$2')
                        if (normalized != text) {
                            bytes = normalized.getBytes(java.nio.charset.StandardCharsets.UTF_8)
                            fileChanged = true
                            patchedEntries++
                        }
                    }
                    zipOut.write(bytes)
                    zipOut.closeEntry()
                }
            } finally {
                zipOut.close()
                zipFile.close()
            }

            if (fileChanged) {
                java.nio.file.Files.move(
                        tempFile.toPath(),
                        jarFile.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                patchedFiles++
            } else {
                tempFile.delete()
            }
        }
        logger.lifecycle("Normalized ${patchedEntries} Fabric API tweaker entries in ${patchedFiles} jars for named dev runtime.")
    }
}

tasks.matching { task ->
    task.name in [
            "runClient",
            "runServer",
            "runDatagen",
            "runGameTest",
            "runClientGameTest",
            "runLocksmithRestartProbe"
    ]
}.configureEach {
    dependsOn("normalizeFabricApiTweakersForNamedDevRuntime")
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    doLast {
        copy {
            from(file('src/main/resources/assets/totem/lang/zh_tw.json'))
            into(file("${destinationDir}/assets/totem/lang"))
            rename { 'zh_cn.json' }
        }
    }
}

tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE.txt') { rename { "${it}_${project.archives_base_name}" } }
}
