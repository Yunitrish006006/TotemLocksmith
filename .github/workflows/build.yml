name: Build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: TotemLocksmith
      - uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          path: TotemCore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build exact Core dependency
        working-directory: TotemCore
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Unit and Fabric GameTests
        working-directory: TotemLocksmith
        run: |
          chmod +x gradlew
          ./gradlew build runGameTest --no-daemon --stacktrace
      - name: Strict 16x16 asset dimensions
        working-directory: TotemLocksmith
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            src/main/resources/assets/totem-locksmith/icon.png
            src/main/resources/assets/totem/textures/item/locksmith/padlock.png
            src/main/resources/assets/totem/textures/item/locksmith/key_blank.png
            src/main/resources/assets/totem/textures/item/locksmith/bound_key.png
          )
          for asset in "${assets[@]}"; do
            file "${asset}" | grep -F '16 x 16'
          done
      - name: Two-JVM persistence probe
        working-directory: TotemLocksmith
        shell: bash
        run: |
          set -euo pipefail
          markers="${RUNNER_TEMP}/totem-locksmith-restart"
          mkdir -p "${markers}"
          ./gradlew runLocksmithRestartProbe --no-daemon --stacktrace \
            -PtotemLocksmithRestartProbePhase=seed \
            -PtotemLocksmithRestartProbeMarkerDir="${markers}"
          test -f "${markers}/seed.ok"
          ./gradlew runLocksmithRestartProbe --no-daemon --stacktrace \
            -PtotemLocksmithRestartProbePhase=verify \
            -PtotemLocksmithRestartProbeMarkerDir="${markers}"
          test -f "${markers}/verify.ok"
      - name: Dedicated Server startup
        working-directory: TotemLocksmith
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=TERM --kill-after=15s 90s ./gradlew runServer --no-daemon --stacktrace > locksmith-server.log 2>&1
          status=$?
          set -e
          if [[ "${status}" -ne 124 ]] \
              || ! grep -F 'Totem Locksmith initialized with fixed-Hopper network authority' locksmith-server.log \
              || ! grep -F 'Done (' locksmith-server.log; then
            cat locksmith-server.log
            exit 1
          fi
