name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  LIBGL_ALWAYS_SOFTWARE: '1'
  MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Locksmith
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Mesa software rendering
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-utils x11-utils xserver-xorg-core xserver-xorg-video-dummy

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 424b90dc3929caa8c1afcfca7e63c50a64bde669
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Build pinned TotemCore
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew .lockstep/TotemCore/gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore jar --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.23'
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          test -f "$core_jar"
          echo "CORE_JAR=$core_jar" >> "$GITHUB_ENV"

      - name: Unit and Fabric GameTests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -PtotemCoreJar="$CORE_JAR" \
            test assemble compileGametestJava runGameTest --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace

      - name: Automated 16x16 format gate (objective)
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            src/main/resources/assets/totem-locksmith/icon.png
            src/main/resources/assets/totem/textures/item/locksmith/padlock.png
            src/main/resources/assets/totem/textures/item/locksmith/key_blank.png
            src/main/resources/assets/totem/textures/item/locksmith/bound_key.png
          )
          for asset in "${assets[@]}"; do
            file "$asset" | grep -F '16 x 16'
          done

      - name: Two-JVM persistence probe
        shell: bash
        run: |
          set -euo pipefail
          markers="${RUNNER_TEMP}/totem-locksmith-restart"
          rm -rf "$markers"
          mkdir -p "$markers"
          ./gradlew -PtotemCoreJar="$CORE_JAR" \
            -PtotemLocksmithRestartProbePhase=seed \
            -PtotemLocksmithRestartProbeMarkerDir="$markers" \
            runLocksmithRestartProbe --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          test -f "$markers/seed.ok"
          test ! -f "$markers/seed.failure"
          ./gradlew -PtotemCoreJar="$CORE_JAR" \
            -PtotemLocksmithRestartProbePhase=verify \
            -PtotemLocksmithRestartProbeMarkerDir="$markers" \
            runLocksmithRestartProbe --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace
          test -f "$markers/verify.ok"
          test ! -f "$markers/verify.failure"

      - name: Dedicated Server startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=TERM --kill-after=15s 90s \
            ./gradlew -PtotemCoreJar="$CORE_JAR" runServer --init-script ${GITHUB_WORKSPACE}/.github/scripts/lavapipe.gradle --no-daemon --stacktrace \
            > locksmith-server.log 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 124 ]] \
              || ! grep -F 'Totem Locksmith initialized with fixed-Hopper network authority' locksmith-server.log \
              || ! grep -F 'Done (' locksmith-server.log; then
            cat locksmith-server.log
            exit 1
          fi

      - name: Bind validated release artifact to this Build
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          core_source="$(git -C .lockstep/TotemCore rev-parse HEAD)"
          test "$core_source" = 424b90dc3929caa8c1afcfca7e63c50a64bde669
          core_sha="$(sha512sum .lockstep/TotemCore/build/libs/totem-core-0.7.23.jar | awk '{print $1}')"
          test "$core_sha" = "$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          test "$sha" = "$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          mkdir -p build/release-artifact
          cp "build/libs/${artifact}" build/release-artifact/
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core_source "$core_source" --arg core_sha "$core_sha" '{repository:$repository,source_commit:$source,run_id:$run,run_attempt:$attempt,version:$version,artifact:$artifact,sha512:$sha,core_version:"0.7.23",core_source_commit:$core_source,core_artifact_sha512:$core_sha}' > build/release-artifact/build-provenance.json

      - name: Upload immutable validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release-artifact/
          if-no-files-found: error
          retention-days: 14
